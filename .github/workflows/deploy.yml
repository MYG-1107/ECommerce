name: Deploy Blazor Client to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/ECommerce.Client/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Set base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/ECommerce/" />|g' src/ECommerce.Client/wwwroot/index.html

      - name: Publish Blazor WASM
        run: dotnet publish src/ECommerce.Client/ECommerce.Client.csproj -c Release -o published-client

      - name: Create SPA fallback
        run: cp published-client/wwwroot/index.html published-client/wwwroot/404.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published-client/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
